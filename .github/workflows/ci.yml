name: DreamForge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:strategy
      - run: npm run test:dreamdex
      - run: npm run test:event-history
      - run: npm run build
      - name: Verify deployed production complex-agent compiler
        if: github.event_name == 'push'
        env:
          DREAMFORGE_URL: https://my-github-basics-project.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
        run: npm run test:agent-live
