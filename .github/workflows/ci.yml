name: DreamForge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:strategy
      - run: npm run test:dreamdex
      - run: npm run test:event-history
      - run: npm run build
      - name: Test deployed complex-agent compiler
        if: github.event_name == 'pull_request'
        env:
          DREAMFORGE_PREVIEW_URL: https://my-github-basics-project-git-age-b0536e-orerei89-5247s-projects.vercel.app
        run: npm run test:agent-preview
